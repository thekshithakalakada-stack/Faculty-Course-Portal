<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login - Faculty Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>Faculty Course Management Portal</h1>
        <p>Faculty Sign In</p>
    </header>

    <!-- NAVIGATION -->
    <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="addCourse.html">Add Course</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>

    <main>

        <section>
            <h2>Faculty Sign In</h2>

            <!-- NOTIFICATION / ALERT MESSAGE BOX -->
            <div id="alertBox" class="alert" style="display: none;"></div>

            <!-- LOGIN FORM -->
            <form id="loginForm" action="login" method="post" onsubmit="return validateLogin()">
                <fieldset>
                    <legend>Credentials</legend>

                    <!-- USERNAME -->
                    <label for="username">Username <span style="color: red;">*</span></label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required>

                    <!-- PASSWORD -->
                    <label for="password">Password <span style="color: red;">*</span></label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </fieldset>

                <!-- SUBMIT AND RESET BUTTONS -->
                <div class="form-actions">
                    <button type="submit" class="btn">Sign In</button>
                    <button type="reset" class="btn btn-reset">Clear</button>
                </div>

                <div class="form-footer-link">
                    Don't have an account? <a href="register.html">Register here</a>
                </div>
            </form>
        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; Faculty Course Management Portal</p>
    </footer>

    <!-- JavaScript -->
    <script>
        function validateLogin() {
            var user = document.getElementById("username").value.trim();
            var pass = document.getElementById("password").value.trim();
            if (user === "") {
                showAlert("Please enter your username.", "danger");
                return false;
            }
            if (pass === "") {
                showAlert("Please enter your password.", "danger");
                return false;
            }
            return true;
        }

        function showAlert(message, type) {
            var box = document.getElementById("alertBox");
            box.textContent = message;
            box.className = "alert alert-" + type;
            box.style.display = "block";
        }

        // Parse URL parameters for status messages
        (function handleUrlParams() {
            var params = new URLSearchParams(window.location.search);

            if (params.get("error") === "invalid_credentials") {
                showAlert("Invalid username or password.", "danger");
            } else if (params.get("error") === "empty_fields") {
                showAlert("Please provide both username and password.", "danger");
            } else if (params.get("error") === "please_login") {
                showAlert("Please sign in to access that page.", "danger");
            } else if (params.get("error") === "session_expired") {
                showAlert("Your session has expired. Please sign in again.", "danger");
            } else if (params.get("registered") === "success") {
                showAlert("Registration successful! You can now sign in with your credentials.", "success");
            } else if (params.get("logout") === "success") {
                showAlert("You have been signed out successfully.", "success");
            }

            var rememberedUser = params.get("user");
            if (rememberedUser) {
                var userField = document.getElementById("username");
                if (userField) {
                    userField.value = rememberedUser;
                }
            }
        })();
    </script>

</body>

</html>
